; Read by the AdmobPlugin export plugin at export time: it writes the AdMob app
; id into AndroidManifest.xml. Not needed at runtime. Not secret.
;
; is_real must match "use_real_ads" in res://data/ads.json (a test checks it).
;   false -> Debug app_id (Google's public sample app) and Google's test ads.
;   true  -> Release app_id (your AdMob app id, ca-app-pub-XXXX~YYYY).
; See docs/release.md "Ads (AdMob)".

