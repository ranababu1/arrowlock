; Read by the AdmobPlugin export plugin at iOS export time: it writes the AdMob
; app id (GADApplicationIdentifier) into Info.plist. Not needed at runtime.
; Not secret. The iOS app has its own AdMob app id, different from Android's.
;
; is_real must be true exactly when "ios_interstitial_unit_id" in
; res://data/ads.json is set (a test checks it).
;   false -> Debug app_id (Google's public iOS sample app). The game then shows
;            no ads on iOS, because there is no iOS ad unit.
;   true  -> Release app_id (your AdMob iOS app id, ca-app-pub-XXXX~YYYY).
; See docs/release-ios.md "Ads (AdMob)".
;
; [ATT] App Tracking Transparency: off. The game does not ask to track, so ads
; are served without the advertising identifier. To turn it on, set
; att_enabled=true and a non-empty att_text, and call
; request_tracking_authorization() before the SDK starts (scripts/services/ads.gd).

[General]

is_real=false

[Debug]

app_id="ca-app-pub-3940256099942544~1458002511"

[Release]

app_id=""

[ATT]

att_enabled=false
att_text=""
